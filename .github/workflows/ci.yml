# Checks the site, then builds the image and publishes it to GHCR.
#
# The test job gates the image: a broken nginx.conf otherwise only shows when
# the container starts, i.e. in production. Pull requests run the test job
# only; nothing is published from a PR.
#
# Actions are pinned to full commit SHAs (the tag is in the comment);
# Dependabot (.github/dependabot.yml) keeps the pins current.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate nginx.conf
        run: |
          docker run --rm \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

      # The whole app is one hand-written file; a truncated or half-merged
      # index.html would otherwise ship as a blank page.
      - name: HTML sanity check
        run: |
          head -c 15 index.html | grep -qi '^<!DOCTYPE html>'
          grep -qi '</html>' index.html
          grep -qi '</body>' index.html

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ottoherdy/kajplanen:latest
            ghcr.io/ottoherdy/kajplanen:${{ github.sha }}
